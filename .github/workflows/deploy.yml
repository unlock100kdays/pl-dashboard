name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish only the site itself — project notes and CI config stay in the
      # repo but out of the deployed bundle. (`.assetsignore` is a Workers-assets
      # feature; `pages deploy` ignores it, so we stage the files instead.)
      - name: Stage site files
        run: |
          mkdir -p dist
          cp index.html styles.css app.js dist/
          cp _headers dist/
          # Stamp the commit SHA into the asset URLs. index.html itself is
          # served must-revalidate, so a new deploy always delivers new
          # asset URLs and the browser cannot keep running an old bundle.
          # Without this, Pages' default max-age=14400 on app.js left
          # browsers up to four hours behind a deploy.
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" dist/index.html
          grep -o 'app.js?v=[a-f0-9]*' dist/index.html
          ls -la dist

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pl-dashboard --branch=main
